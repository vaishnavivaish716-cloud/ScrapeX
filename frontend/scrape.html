<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Scrape</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav><h2 style="color:#38bdf8;">ScrapeX</h2><div><a href="index.html">Home</a><a href="products.html">Products</a><a href="history.html">History</a><a href="ai.html">AI Assistant</a><a href="scrape.html" style="color:#38bdf8;">Scrape</a></div></nav>
<div class="container" style="max-width:600px"><h1>Scrape New Products</h1><div class="card" style="margin-top:20px"><input id="urlInput" value="https://books.toscrape.com/" style="width:100%;padding:12px;border-radius:8px;border:none;"><button id="scrapeBtn" style="width:100%;margin-top:15px;padding:12px;background:#38bdf8;border:none;border-radius:8px;font-weight:bold;cursor:pointer">Start Scraping</button><p id="status" style="margin-top:15px;text-align:center"></p></div></div>
<script>document.getElementById("scrapeBtn").onclick=async()=>{let url=document.getElementById("urlInput").value;let s=document.getElementById("status");let b=document.getElementById("scrapeBtn");b.innerText="Scraping...";b.disabled=true;s.innerText="Wait...";s.style.color="yellow";try{let r=await fetch("/api/scrape",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});let d=await r.json();if(d.success){s.innerText=`Success! ${d.count} products`;s.style.color="#22c55e"}else{s.innerText=d.message;s.style.color="red"}}catch(e){s.innerText=e;s.style.color="red"}b.innerText="Start Scraping";b.disabled=false}</script><script src="js/voice-ai.js"></script></body></html>
