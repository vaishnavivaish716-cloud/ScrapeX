<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav>
    <h2 style="color:#38bdf8;">ScrapeX</h2>
    <div>
        <a href="index.html" style="color:#38bdf8;">Home</a>

<div class="container">
    <h1 style="margin-bottom:20px;">Welcome to ScrapeX Analytics</h1>
    
    <div class="grid" id="summaryCards">
        <div class="card"><h3>Loading...</h3><p>Total</p></div>
        <div class="card"><h3>Loading...</h3><p>Avg Price</p></div>
        <div class="card"><h3>Loading...</h3><p>Rating</p></div>
        <div class="card"><h3>Loading...</h3><p>Reviews</p></div>
    </div>

    <div class="grid" style="margin-top:30px;">
        <div class="chart-box">
            <h3 style="margin-bottom:10px;">Top 5 Price Distribution</h3>
            <canvas id="priceChart"></canvas>
        </div>
        <div class="chart-box">
            <h3 style="margin-bottom:10px;">Top 5 Rating Distribution</h3>
            <canvas id="ratingChart"></canvas>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
