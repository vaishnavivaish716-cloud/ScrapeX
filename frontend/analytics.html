<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav>
    <h2 style="color:#38bdf8;">ScrapeX</h2>
    <div>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="scrape.html">Scrape</a>
        <a href="history.html">History</a>
        <a href="ai.html">AI Assistant</a>
        <a href="analytics.html" style="color:#38bdf8;">Analytics</a>
    </div>
</nav>

<div class="container">
    <h1>Advanced Analytics</h1>
    <div class="grid" style="margin-top:20px;">
        <div class="card"><h3 id="total">0</h3><p>Total Products</p></div>
        <div class="card"><h3 id="avgPrice">0</h3><p>Average Price</p></div>
        <div class="card"><h3 id="avgRate">0</h3><p>Average Rating</p></div>
    </div>

    <div class="grid" style="margin-top:30px;">
        <div class="chart-box"><canvas id="barChart"></canvas></div>
        <div class="chart-box"><canvas id="pieChart"></canvas></div>
    </div>
</div>

<script>
async function loadAnalytics(){
 let res = await fetch("/api/summary");
 let s = await res.json();
 document.getElementById("total").innerText = s.total_products;
 document.getElementById("avgPrice").innerText = "₹" + s.average_price;
 document.getElementById("avgRate").innerText = s.average_rating + " ⭐";

 let res2 = await fetch("/api/analytics");
 let a = await res2.json();
 
 new Chart(document.getElementById("barChart"),{
   type:'bar',
   data:{labels:a.price_distribution.slice(0,5).map(x=>x.name.substring(0,10)), datasets:[{label:'Price', data:a.price_distribution.slice(0,5).map(x=>x.price), backgroundColor:'#38bdf8'}]},
   options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'white'}}},scales:{x:{ticks:{color:'white'}},y:{ticks:{color:'white'}}}}
 });
 new Chart(document.getElementById("pieChart"),{
   type:'doughnut',
   data:{labels:a.rating_distribution.slice(0,5).map(x=>x.name.substring(0,10)), datasets:[{data:a.rating_distribution.slice(0,5).map(x=>x.rating), backgroundColor:['#38bdf8','#22c55e','#f59e0b','#ef4444','#8b5cf6']}]},
   options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'white'}}}}
 });
}
loadAnalytics();
</script>
<script src="js/voice-ai.js"></script>
</body>
</html>
